name: Build 4K AI-Studio Android APK
on:
  workflow_dispatch:
  push:
    branches: [ai-studio]
    paths:
      - 'capacitor.config.json'
      - 'package.json'
      - 'public/icons/app-icon.svg'
      - 'public/manifest.webmanifest'
      - 'public/index.html'
      - 'public/app.js'
      - 'public/sw.js'
      - 'server.js'
      - '.github/workflows/android-apk.yml'
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Validate JavaScript and API connectivity
        run: |
          node --check public/app.js
          node --check server.js
          node -e "JSON.parse(require('fs').readFileSync('public/manifest.webmanifest','utf8'))"
          PORT=4173 node server.js > /tmp/ai-studio-test.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/api/health > /tmp/ai-studio-health.json; then break; fi
            sleep 1
          done
          node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/ai-studio-health.json','utf8')); if (!h.ok) process.exit(1)"
          curl -sS -D /tmp/ai-studio-cors.txt -o /dev/null -X OPTIONS \
            -H 'Origin: https://localhost' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            http://127.0.0.1:4173/api/assistant
          grep -qi 'Access-Control-Allow-Origin: https://localhost' /tmp/ai-studio-cors.txt
      - name: Add Capacitor Android platform
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Generate native Android launcher icons
        run: |
          npm install --no-save @capacitor/assets sharp
          mkdir -p assets
          node --input-type=module -e "import sharp from 'sharp'; await sharp('public/icons/app-icon.svg').resize(1024, 1024).png().toFile('assets/icon.png');"
          npx capacitor-assets generate --android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-studio-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
